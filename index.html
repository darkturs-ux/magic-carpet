
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magic Carpet Ride</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#09051a;}
canvas{display:block;}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(5,2,20,0.65);backdrop-filter:blur(4px);}
#overlay.hidden{display:none;}
.panel{background:linear-gradient(160deg,#130930,#1c1208);border:2px solid rgba(255,200,50,0.45);border-radius:24px;padding:26px 30px;text-align:center;max-width:290px;width:88%;box-shadow:0 0 50px rgba(120,40,255,0.35);}
.panel h1{font-family:'Georgia',serif;font-size:clamp(1.1rem,5vw,1.7rem);color:#ffd700;margin-bottom:8px;line-height:1.3;}
.panel p{font-family:'Helvetica Neue',sans-serif;font-size:.8rem;color:rgba(210,190,255,0.75);margin-bottom:16px;line-height:1.8;}
.stat{font-family:'Helvetica Neue',sans-serif;font-size:.92rem;font-weight:900;color:#ffd700;margin-bottom:12px;}
.btn{font-family:'Georgia',serif;font-size:.9rem;padding:11px 28px;background:linear-gradient(135deg,#7b2ff7,#e8059a);color:#fff;border:none;border-radius:14px;cursor:pointer;box-shadow:0 4px 18px rgba(120,40,255,0.5);letter-spacing:1px;}
.btn:active{transform:scale(.95);}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:10;pointer-events:none;background:linear-gradient(180deg,rgba(5,2,20,0.75),transparent);}
#hud-left{display:flex;flex-direction:column;gap:4px;}
#hud-score{font-family:'Georgia',serif;font-size:1.35rem;color:#fff;text-shadow:0 0 12px rgba(255,200,50,0.8);}
#hud-hearts{font-size:1.3rem;letter-spacing:2px;}
#hud-coins{font-family:'Helvetica Neue',sans-serif;font-size:.95rem;font-weight:900;color:#ffd700;}
#powerup-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:160px;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;display:none;z-index:10;}
#powerup-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#00e8d4,#ffd700);transition:width .1s;}
#powerup-label{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);font-family:'Helvetica Neue',sans-serif;font-size:.75rem;font-weight:900;color:#00e8d4;text-shadow:0 0 8px rgba(0,232,212,0.8);display:none;z-index:10;white-space:nowrap;}
</style>
</head>

    <button class="btn" id="btn-start">✦ FLY ✦</button>
  </div>
  <div class="panel hidden" id="panel-dead">
    <div style="font-size:1.8rem;margin-bottom:6px" id="dead-emo">💨</div>
    <h1 id="dead-title">Whoops!</h1>
    <div class="stat" id="dead-score"></div>
    <div class="stat" id="dead-best"></div>
    <button class="btn" id="btn-retry">✦ Try Again ✦</button>
  </div>
</div>
<script>



const iBoyOrig = document.getElementById('img-boy');
const iPrince2 = document.getElementById('img-prince2');
const iPrince3 = document.getElementById('img-prince3');
const iPrince4 = document.getElementById('img-prince4');
const iMin     = document.getElementById('img-min');
const iGenBad  = document.getElementById('img-gen');
const iBg      = document.getElementById('img-bg');
const iJasmine = document.getElementById('img-jas');

// Force-preload enemy genie sprite to avoid "DANGER without sprite" race.
const iGenBlue=document.createElement('canvas');
let genieReady=false;
let resolveGenieReady;
const genieReadyPromise=new Promise(res=>{resolveGenieReady=res;});
function buildBlueGenieSprite(srcImg){
  iGenBlue.width=srcImg.naturalWidth;
  iGenBlue.height=srcImg.naturalHeight;
  const gx=iGenBlue.getContext('2d');
  gx.drawImage(srcImg,0,0);
  gx.globalCompositeOperation='multiply';
  gx.fillStyle='rgba(30,144,255,0.78)';
  gx.fillRect(0,0,iGenBlue.width,iGenBlue.height);
  gx.globalCompositeOperation='destination-in';
  gx.drawImage(srcImg,0,0);
}
function markGenieReady(){
  if(genieReady) return;
  genieReady=true;
  resolveGenieReady();
}
const geniePreloadImg=new Image();
geniePreloadImg.onload=()=>{
  buildBlueGenieSprite(geniePreloadImg);
  markGenieReady();
};
geniePreloadImg.onerror=()=>{
  console.warn('[genie] Preload failed, using fallback image source.');
  if(iGenBad.complete && iGenBad.naturalWidth>0){
    buildBlueGenieSprite(iGenBad);
  }
  markGenieReady();
};
geniePreloadImg.src=iGenBad.src;
if(geniePreloadImg.complete && geniePreloadImg.naturalWidth>0){
  buildBlueGenieSprite(geniePreloadImg);
  markGenieReady();
}

const iBoy=document.createElement('canvas');
iBoyOrig.onload=function(){
  iBoy.width=iBoyOrig.naturalWidth; iBoy.height=iBoyOrig.naturalHeight;
  const bx=iBoy.getContext('2d');
  bx.translate(iBoy.width,0); bx.scale(-1,1);
  bx.drawImage(iBoyOrig,0,0);
};

const C=document.getElementById('c');
const ctx=C.getContext('2d');
let W,H;
function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);

let state='idle',score=0,coinScore=0,best=+localStorage.getItem('mcr6_best')||0;
let frame=0,bgX=0;
let px,py,pvy,pangle,wave;
let minarets=[],mTmr=0;
let coinList=[],parts=[],floatTexts=[];
let genies=[],gTmr=300;
let held=false;
let lives=3,hitCooldown=0;
const HIT_CD=90;
let powerUp=0; // frames remaining
const POWER_DUR=300; // 5 sec at 60fps
let screenFlash={col:'',life:0};

// Background music playlist
const AUDIO_CACHE_BUST='v='+Math.floor(Math.random()*1e9);
const MUSIC_TRACKS=[
  'music/track1.mp3',
  'music/track2.mp3',
  'music/track3.mp3',
  'music/track4.mp3'
].map(p=>p+'?'+AUDIO_CACHE_BUST);
const TRACK_VOLUME=0.6;
const audio=new Audio();
audio.preload='auto';
audio.volume=TRACK_VOLUME;
let currentTrackIdx=0;
let musicStarted=false;
let audioUnlocked=false;
let isMuted=localStorage.getItem('mcr6_music_muted')==='1';
audio.muted=isMuted;
const AudioContextCtor=window.AudioContext||window.webkitAudioContext;
const musicCtx=AudioContextCtor?new AudioContextCtor():null;

const soundBtn=document.createElement('button');
soundBtn.type='button';
soundBtn.setAttribute('aria-label','Toggle sound');
soundBtn.style.position='fixed';
soundBtn.style.top='14px';
soundBtn.style.right='14px';
soundBtn.style.zIndex='30';
soundBtn.style.pointerEvents='auto';
soundBtn.style.padding='8px 11px';
soundBtn.style.border='none';
soundBtn.style.borderRadius='12px';
soundBtn.style.cursor='pointer';
soundBtn.style.font='700 13px "Helvetica Neue",sans-serif';
soundBtn.style.letterSpacing='0.3px';
soundBtn.style.background='linear-gradient(135deg,#11335d,#3b1774)';
soundBtn.style.color='#fff';
soundBtn.style.boxShadow='0 4px 14px rgba(0,0,0,0.35)';
soundBtn.style.userSelect='none';
document.body.appendChild(soundBtn);
const nextTrackBtn=document.createElement('button');
nextTrackBtn.type='button';
nextTrackBtn.setAttribute('aria-label','Next track');
nextTrackBtn.style.position='fixed';
nextTrackBtn.style.top='14px';
nextTrackBtn.style.right='96px';
nextTrackBtn.style.zIndex='30';
nextTrackBtn.style.pointerEvents='auto';
nextTrackBtn.style.width='42px';
nextTrackBtn.style.height='34px';
nextTrackBtn.style.border='none';
nextTrackBtn.style.borderRadius='12px';
nextTrackBtn.style.cursor='pointer';
nextTrackBtn.style.font='700 20px Georgia,serif';
nextTrackBtn.style.lineHeight='1';
nextTrackBtn.style.background='linear-gradient(135deg,#0d4782,#1e90ff)';
nextTrackBtn.style.color='#e8f3ff';
nextTrackBtn.style.boxShadow='0 4px 14px rgba(0,0,0,0.35)';
nextTrackBtn.style.userSelect='none';
nextTrackBtn.textContent='𝄞';
document.body.appendChild(nextTrackBtn);
const trackIndicator=document.createElement('div');
trackIndicator.style.position='fixed';
trackIndicator.style.top='16px';
trackIndicator.style.right='144px';
trackIndicator.style.zIndex='30';
trackIndicator.style.padding='6px 9px';
trackIndicator.style.borderRadius='10px';
trackIndicator.style.font='700 12px "Helvetica Neue",sans-serif';
trackIndicator.style.background='rgba(10,20,45,0.7)';
trackIndicator.style.color='#d8ecff';
trackIndicator.style.boxShadow='0 4px 12px rgba(0,0,0,0.28)';
trackIndicator.style.userSelect='none';
document.body.appendChild(trackIndicator);

function updateSoundButton(){
  soundBtn.textContent=isMuted?'🔇 OFF':'🔊 ON';
}
updateSoundButton();
function updateTrackIndicator(){
  trackIndicator.textContent='♪ '+(currentTrackIdx+1)+'/'+MUSIC_TRACKS.length;
}
updateTrackIndicator();

function resumeAudioContextIfNeeded(){
  if(musicCtx && musicCtx.state==='suspended'){
    musicCtx.resume().catch(()=>{});
  }
}
function unlockAudio(){
  if(audioUnlocked) return;
  resumeAudioContextIfNeeded();
  audioUnlocked=true;
}
function applyPlaybackAtCurrentIndex(){
  updateTrackIndicator();
  resumeAudioContextIfNeeded();
  // iOS Safari fix: play() must be synchronous in user gesture call-stack.
  // Do NOT use setTimeout or canplay listeners — they break the gesture chain.
  audio.pause();
  audio.src=MUSIC_TRACKS[currentTrackIdx];
  audio.muted=isMuted;
  audio.volume=TRACK_VOLUME;
  audio.load();
  var playPromise=audio.play();
  if(playPromise!==undefined){
    playPromise.catch(function(err){
      console.warn('[music] play() rejected for track '+(currentTrackIdx+1)+':', err.message);
    });
  }
}
function advanceToNextTrack(){
  currentTrackIdx=(currentTrackIdx+1)%MUSIC_TRACKS.length;
  applyPlaybackAtCurrentIndex();
}
function ensureMusicStartedFromStartButton(){
  if(!musicStarted) currentTrackIdx=0;
  applyPlaybackAtCurrentIndex();
  musicStarted=true;
}
function ensureMusicOnRetry(){
  if(!musicStarted){
    currentTrackIdx=0;
    musicStarted=true;
  }
  applyPlaybackAtCurrentIndex();
}
audio.addEventListener('ended',function(){
  advanceToNextTrack();
});
audio.addEventListener('error',function(){
  console.warn('[music] Track load/playback error on track '+(currentTrackIdx+1)+'.');
});
soundBtn.addEventListener('click',()=>{
  resumeAudioContextIfNeeded();
  isMuted=!isMuted;
  audio.muted=isMuted;
  localStorage.setItem('mcr6_music_muted',isMuted?'1':'0');
  updateSoundButton();
});
nextTrackBtn.addEventListener('click',()=>{
  resumeAudioContextIfNeeded();
  if(!musicStarted){
    console.warn('[music] Press START first to unlock audio on iOS.');
    return;
  }
  advanceToNextTrack();
});
document.addEventListener('touchstart',()=>{
  unlockAudio();
},{passive:true,once:true});

// Coin types
const COIN_TYPES=[
  {col0:'#fff8cc',col1:'#ffd700',col2:'#a06800',pts:1,sym:'🪙',label:'+1'},
  {col0:'#f0f0ff',col1:'#c8d8ff',col2:'#6080b0',pts:2,sym:'💎',label:'+2'},
  {col0:'#ffcccc',col1:'#ff4466',col2:'#880022',pts:3,sym:'❤️',label:'+3'},
];

function updateHUD(){
  document.getElementById('hud-score').textContent=score;
  document.getElementById('hud-coins').textContent='🪙 '+coinScore;
  document.getElementById('hud-hearts').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
}
function updatePowerBar(){
  const bar=document.getElementById('powerup-bar');
  const fill=document.getElementById('powerup-fill');
  const lbl=document.getElementById('powerup-label');
  if(powerUp>0){
    bar.style.display='block'; lbl.style.display='block';
    fill.style.width=(powerUp/POWER_DUR*100)+'%';
  } else {
    bar.style.display='none'; lbl.style.display='none';
  }
}

const GRAV  =()=>0.18*(H/700);
const HOLDF =()=>-0.22*(H/700);
const TAPV  =()=>-3.2*(H/700);
const MAXUP =()=>-5.0*(H/700);
const MAXDN =()=>6.5*(H/700);
const PSPD  =()=>2.0*(W/400);
const MW    =()=>320*(W/400);
const PIPE_INT=130;

function initGame(){
  px=W*0.22; py=H*0.45; pvy=0; pangle=0; wave=0;
  minarets=[]; mTmr=0; coinList=[]; parts=[]; genies=[]; gTmr=300;
  floatTexts=[];
  score=0; coinScore=0; frame=0; bgX=0;
  lives=3; hitCooldown=0; powerUp=0;
  screenFlash={col:'',life:0};
  updateHUD(); updatePowerBar();
}

function tap(){
  if(state==='idle'){
    state='playing';
    document.getElementById('overlay').classList.add('hidden');
    initGame(); pvy=TAPV(); return;
  }
  if(state==='playing'){
    if(pvy>TAPV()*0.5) pvy=TAPV();
    else pvy=Math.max(pvy+TAPV()*0.3,MAXUP());
    // carpet flutter
    for(let i=0;i<4;i++){
      const a=Math.PI+Math.random()*0.8-0.4;
      parts.push({x:px-35*(W/400),y:py+5,vx:Math.cos(a)*2,vy:Math.sin(a)*1.2,life:0.8,r:2.5,col:'#c8a0ff',glow:false});
    }
  }
}

document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!held){held=true;tap();}}});
document.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')held=false;});
C.addEventListener('touchstart',e=>{e.preventDefault();held=true;tap();},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();held=false;},{passive:false});
C.addEventListener('mousedown',()=>{held=true;tap();});
C.addEventListener('mouseup',()=>held=false);
document.getElementById('btn-start').addEventListener('click',()=>{
  resumeAudioContextIfNeeded();
  unlockAudio();
  ensureMusicStartedFromStartButton();
  held=false;
  document.getElementById('overlay').classList.add('hidden');
  state='playing';
  initGame();
  pvy=TAPV();
});
document.getElementById('btn-retry').addEventListener('click',()=>{
  resumeAudioContextIfNeeded();
  unlockAudio();
  ensureMusicOnRetry();
  held=false;
  document.getElementById('overlay').classList.add('hidden');
  state='playing';
  initGame();
});

function spawnMinaret(){
  const mw=MW();
  const mh=H*0.20+Math.random()*(H*0.38);
  const botY=H-mh;
  // Coins: above minaret tip + random floating coins
  if(Math.random()<0.8){
    const ct=COIN_TYPES[Math.floor(Math.random()*COIN_TYPES.length)];
    coinList.push({x:W+mw/2,y:botY-55*(H/700),r:18*(W/400),collected:false,spin:0,type:ct,bob:Math.random()*Math.PI*2});
  }
  // Extra floating coin randomly placed
  if(Math.random()<0.5){
    const ct=COIN_TYPES[Math.floor(Math.random()*COIN_TYPES.length)];
    coinList.push({x:W+mw+80+Math.random()*120,y:H*0.15+Math.random()*H*0.6,r:13*(W/400),collected:false,spin:0,type:ct,bob:Math.random()*Math.PI*2});
  }
  minarets.push({x:W+mw,botY,scored:false});
}

function spawnGenie(){
  const good=Math.random()>0.45;
  genies.push({
    x:W+90,
    y:H*0.15+Math.random()*(H*0.62),
    vy:(Math.random()-0.5)*0.9,
    phase:Math.random()*Math.PI*2,
    good
  });
}

function coinBurst(x,y,col,pts){
  // Big explosion of sparks
  const count=18+pts*6;
  for(let i=0;i<count;i++){
    const a=(i/count)*Math.PI*2+Math.random()*0.3;
    const spd=2+Math.random()*4+pts;
    parts.push({
      x,y,
      vx:Math.cos(a)*spd,
      vy:Math.sin(a)*spd-2,
      life:1,
      r:2+Math.random()*3,
      col,
      glow:true
    });
  }
  // Ring flash
  parts.push({x,y,vx:0,vy:0,life:0.7,r:30,col,glow:true,ring:true,rExpand:4});
  // Floating score text
  floatTexts.push({x,y,text:'+'+pts,life:1,col});
}

function loseLife(){
  if(hitCooldown>0||powerUp>0)return;
  lives--; hitCooldown=HIT_CD;
  pvy=TAPV()*0.7;
  screenFlash={col:'rgba(255,50,50,0.35)',life:15};
  for(let i=0;i<14;i++){
    const a=(i/14)*Math.PI*2;
    parts.push({x:px,y:py,vx:Math.cos(a)*5,vy:Math.sin(a)*5,life:1,r:5,col:'#ff4444',glow:true});
  }
  updateHUD();
  if(lives<=0)die();
}

function die(){
  if(state!=='playing')return;
  state='dead'; held=false;
  if(score>best){best=score;localStorage.setItem('mcr6_best',best);}
  setTimeout(()=>{
    document.getElementById('dead-emo').textContent=score>15?'🌟':score>8?'✨':'💨';
    document.getElementById('dead-title').textContent=score>15?'Amazing!':score>8?'Nice ride!':'Whoops!';
    document.getElementById('dead-score').textContent='Score: '+score+'  🪙 '+coinScore;
    document.getElementById('dead-best').textContent='Best: '+best;
    document.getElementById('panel-start').classList.add('hidden');
    document.getElementById('panel-dead').classList.remove('hidden');
    document.getElementById('overlay').classList.remove('hidden');
  },500);
}

function update(){
  if(state!=='playing')return;
  frame++;
  const spd=PSPD();
  if(hitCooldown>0)hitCooldown--;
  if(powerUp>0){powerUp--;updatePowerBar();}

  if(held)pvy=Math.max(pvy+HOLDF(),MAXUP());
  pvy+=GRAV(); pvy=Math.min(pvy,MAXDN());
  pangle+=(pvy*0.042-pangle)*0.10;
  py+=pvy; wave+=0.08; bgX-=spd*0.25;
  if(screenFlash.life>0)screenFlash.life--;

  // Minarets
  mTmr++;
  if(mTmr>=PIPE_INT){spawnMinaret();mTmr=0;}
  minarets.forEach(m=>m.x-=spd);
  minarets=minarets.filter(m=>m.x>-MW()*2);
  minarets.forEach(m=>{
    if(!m.scored&&m.x+MW()<px){m.scored=true;score++;updateHUD();}
  });

  // Genies
  gTmr--;
  if(gTmr<=0){spawnGenie();gTmr=220+Math.floor(Math.random()*180);}
  genies.forEach(g=>{
    g.x-=spd*1.3;
    g.vy+=(Math.random()-0.5)*0.07;
    g.vy=Math.max(-1.3,Math.min(1.3,g.vy));
    g.y+=g.vy; g.phase+=0.04;
    if(g.y<H*0.08)g.vy+=0.3;
    if(g.y>H*0.88)g.vy-=0.3;
  });

  // Genie collision
  const ghw=38*(W/400),ghh=50*(H/700);
  for(let i=genies.length-1;i>=0;i--){
    const g=genies[i];
    const dx=(g.x-px)/ghw,dy=(g.y-py)/ghh;
    if(dx*dx+dy*dy<1){
      if(g.good){
        // Power up!
        powerUp=POWER_DUR;
        updatePowerBar();
        screenFlash={col:'rgba(0,232,212,0.3)',life:20};
        // Golden burst
        for(let j=0;j<20;j++){
          const a=(j/20)*Math.PI*2;
          parts.push({x:px,y:py,vx:Math.cos(a)*5,vy:Math.sin(a)*5-1,life:1.2,r:5,col:'#00e8d4',glow:true});
        }
        floatTexts.push({x:px,y:py-30,text:'✨ JASMINE!',life:1.5,col:'#00e8d4'});
      } else {
        if(powerUp>0){
          // Bounce off
          screenFlash={col:'rgba(120,50,255,0.25)',life:10};
        } else {
          // Instant die from bad genie
          screenFlash={col:'rgba(120,0,200,0.5)',life:25};
          for(let j=0;j<16;j++){
            const a=(j/16)*Math.PI*2;
            parts.push({x:px,y:py,vx:Math.cos(a)*6,vy:Math.sin(a)*6,life:1.2,r:6,col:'#c8a0ff',glow:true});
          }
          die();
        }
      }
      genies.splice(i,1);
    }
  }
  genies=genies.filter(g=>g.x>-130);

  // Coins
  coinList.forEach(c=>{c.x-=spd;c.spin+=0.05;c.bob+=0.07;});
  coinList=coinList.filter(c=>c.x>-50);
  for(let i=coinList.length-1;i>=0;i--){
    const c=coinList[i];
    if(!c.collected){
      const dx=c.x-px,dy=c.y-py;
      if(Math.sqrt(dx*dx+dy*dy)<c.r+26*(W/400)){
        c.collected=true;
        coinScore+=c.type.pts;
        coinBurst(c.x,c.y,c.type.col1,c.type.pts);
        updateHUD();
      }
    }
  }
  coinList=coinList.filter(c=>!c.collected);

  // Particles
  parts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.07;
    if(p.ring)p.r+=p.rExpand;
    p.life-=p.ring?0.06:0.028;
    p.vx*=0.97; p.vy*=0.97;
  });
  parts=parts.filter(p=>p.life>0);

  // Float texts
  floatTexts.forEach(t=>{t.y-=1.2;t.life-=0.02;});
  floatTexts=floatTexts.filter(t=>t.life>0);

  // Minaret collision — pixel-perfect tip only
  const mw=MW(), hw=68*(W/400), hh=36*(H/700);
  let hit=false;
  minarets.forEach(m=>{
    const cX = m.x + mw/2;
    const tipY = m.botY;
    // Only the exact tip: 2px radius, bottom-center of prince
    if(Math.abs(px - cX) < 2 && (py+hh) > tipY && (py+hh) < tipY+4) hit=true;
    // Body: 4px wide column below tip
    if(Math.abs(px - cX) < 4 && (py+hh) > tipY+4) hit=true;
  });
  if(py-20*(H/700)<0 || py+20*(H/700)>H) hit=true;
  if(hit) loseLife();
}

// ── DRAW ──
function drawBg(){
  if(iBg.complete&&iBg.naturalWidth>0){
    const ox=((bgX%W)+W)%W;
    ctx.drawImage(iBg,ox-W,0,W,H);
    ctx.drawImage(iBg,ox,0,W,H);
    ctx.drawImage(iBg,ox+W,0,W,H);
  } else {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#09051a');g.addColorStop(1,'#200d40');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  ctx.fillStyle='rgba(4,1,18,0.15)';ctx.fillRect(0,0,W,H);
  if(screenFlash.life>0){
    ctx.globalAlpha=screenFlash.life/25;
    ctx.fillStyle=screenFlash.col;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
}

function drawMinarets(){
  minarets.forEach(m=>{
    const mw=MW(),mh=H-m.botY;
    if(iMin.complete&&iMin.naturalWidth>0){
      ctx.drawImage(iMin,m.x,m.botY,mw,mh);
    } else {
      ctx.fillStyle='#8a6030';ctx.fillRect(m.x,m.botY,mw,mh);
    }

  });
}

function drawCoins(){
  coinList.forEach(c=>{
    const bobY=Math.sin(c.bob)*5*(H/700);
    ctx.save();ctx.translate(c.x,c.y+bobY);ctx.rotate(c.spin);
    // Glow
    ctx.globalAlpha=0.35;
    const glow=ctx.createRadialGradient(0,0,0,0,0,c.r*2.2);
    glow.addColorStop(0,c.type.col1);glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,c.r*2.2,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // Coin body
    const g=ctx.createRadialGradient(-c.r*0.3,-c.r*0.3,0,0,0,c.r);
    g.addColorStop(0,c.type.col0);g.addColorStop(0.6,c.type.col1);g.addColorStop(1,c.type.col2);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();
    // Symbol
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.font='bold '+(c.r*1.1)+'px serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.type.sym,0,1);
    ctx.restore();
  });
}

function drawGenies(){
  genies.forEach(g=>{
    const gw=g.good?75*(W/400):90*(W/400),gh=g.good?110*(H/700):120*(H/700);
    const bob=Math.sin(g.phase)*6;
    ctx.save();ctx.translate(g.x,g.y+bob);
    // Glow colour depends on type
    const glowCol=g.good?'#00e8d4':'#1e90ff';
    ctx.globalAlpha=0.18+0.08*Math.sin(g.phase*1.3);
    const glow=ctx.createRadialGradient(0,0,0,0,0,gw);
    glow.addColorStop(0,glowCol);glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,gw,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    const badImg=(iGenBlue.width>0||(iGenBlue.complete&&iGenBlue.naturalWidth>0))?iGenBlue:iGenBad;
    const img=g.good?iJasmine:badImg;
    if(img.width>0||( img.complete&&img.naturalWidth>0))
      ctx.drawImage(img,-gw/2,-gh/2,gw,gh);
    // Label above
    ctx.fillStyle=g.good?'#00e8d4':'#1e90ff';
    ctx.font='bold '+(11*(W/400))+'px Helvetica Neue,sans-serif';
    ctx.textAlign='center';
    ctx.fillText(g.good?'✨ BONUS':'☠ DANGER',-0,-gh/2-8*(H/700));
    ctx.restore();
  });
}

function drawParticles(){
  parts.forEach(p=>{
    ctx.save();
    if(p.glow){
      ctx.shadowBlur=12;ctx.shadowColor=p.col;
    }
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    if(p.ring){
      ctx.strokeStyle=p.col;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
    } else {
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });
}

function drawFloatTexts(){
  floatTexts.forEach(t=>{
    ctx.save();
    ctx.globalAlpha=Math.min(1,t.life*1.5);
    ctx.shadowBlur=10;ctx.shadowColor=t.col;
    ctx.fillStyle=t.col;
    ctx.font='bold '+(16*(W/400))+'px Georgia,serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t.text,t.x,t.y);
    ctx.restore();
  });
}

function drawPlayer(x,y,angle){
  const _sc=(H/700)*0.85; const iw=Math.round(160*_sc), ih=Math.round(87*_sc);
  if(hitCooldown>0&&Math.floor(hitCooldown/6)%2===0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  // Power-up golden aura
  if(powerUp>0){
    const pulse=0.5+0.5*Math.sin(frame*0.15);
    ctx.shadowBlur=20+pulse*15;
    ctx.shadowColor=`rgba(0,255,${100+pulse*155},0.9)`;
    // Extra ring
    ctx.globalAlpha=0.25+pulse*0.2;
    const aura=ctx.createRadialGradient(0,0,iw*0.2,0,0,iw*0.7);
    aura.addColorStop(0,'rgba(0,255,136,0.6)');
    aura.addColorStop(1,'transparent');
    ctx.fillStyle=aura;
    ctx.save();ctx.scale(1,1.7);ctx.beginPath();ctx.arc(0,0,iw*0.7,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.globalAlpha=1;
  }
  if(iPrince4 && iPrince4.complete && iPrince4.naturalWidth>0){
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(iPrince4,-iw/2,-ih/2,iw,ih);
  } else if(iPrince3 && iPrince3.complete && iPrince3.naturalWidth>0){
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(iPrince3,-iw/2,-ih/2,iw,ih);
  } else if(iBoy.width>0){
    ctx.drawImage(iBoy,-iw/2,-ih/2,iw,ih);
  }
  ctx.shadowBlur=0;
  // Carpet trail sparks
  if(state==='playing'){
    const trailCol=powerUp>0?'#00ff88':'#c8a0ff';
    ctx.globalAlpha=0.3+0.12*Math.sin(wave*2);
    ctx.fillStyle=trailCol;
    ctx.beginPath();ctx.arc(-iw*0.46,2,3.5*(W/400),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.18;
    ctx.beginPath();ctx.arc(-iw*0.56,8,2.5*(W/400),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function draw(){
  drawBg();
  drawMinarets();
  drawCoins();
  drawGenies();
  drawParticles();
  drawFloatTexts();
  ctx.globalAlpha=1;
  if(state==='idle')drawPlayer(W*0.22,H*0.45+Math.sin(frame*0.04)*9*(H/700),0);
  else if(state!=='dead')drawPlayer(px,py,pangle);
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
